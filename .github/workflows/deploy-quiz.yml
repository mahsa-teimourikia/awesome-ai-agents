name: Deploy AI Agents Learning Hub to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "quiz/**"
      - "hub/**"
      - ".github/workflows/deploy-quiz.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quiz
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test quiz data and grading
        run: npm test
      - name: Validate Hub links
        working-directory: .
        run: node scripts/validate-hub-links.mjs
      - name: Pages smoke check
        working-directory: .
        run: node scripts/pages-smoke.mjs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble learning site
        run: |
          mkdir -p site/quiz
          cp -R hub/. site/
          cp -R quiz/. site/quiz/
      - name: Upload learning hub
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
