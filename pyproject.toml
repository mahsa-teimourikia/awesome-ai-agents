[project]
name = "awsome-ai-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "e2b-code-interpreter>=2.9.0",
]

[project.optional-dependencies]
learner = [
    "jupyter",
    "ipykernel",
    "pydantic",
    "pydantic-ai",
    "openai",
    "anthropic",
    "langchain",
    "langgraph",
    "langchain-openai",
    "pyautogen",
    "autogen",
    "crewai",
    "agentops",
    "pandas",
    "mcp",
    "openai-agents",
    "chromadb",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "temporalio",
    "dspy-ai",
    "semantic-router==0.1.16",
    "matplotlib",
    "numpy",
    "tqdm",
    "umap-learn",
    "playwright>=1.40.0",
    "nest-asyncio>=1.5.0"
]
contributor = [
    "awsome-ai-agents[learner]",
    "pytest",
    "nbclient",
    "nbformat",
    "nbconvert",
]

[tool.setuptools]
py-modules = []
packages = ["awsome_agents"]
