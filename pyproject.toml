[project]
name = "awsome-ai-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "e2b-code-interpreter>=2.9.0",
]

[project.optional-dependencies]
frameworks = [
    "pydantic-ai>=0.0.14",
    "langgraph>=0.2.0",
    "openai-agents>=0.1.0"
]
core = [
    "jupyter",
    "ipykernel",
    "pydantic>=2.0.0",
    "pandas",
    "openai",
    "nest-asyncio>=1.5.0"
]
beginner = [
    "awsome-ai-agents[core]"
]
browser = [
    "playwright>=1.40.0"
]
intermediate = [
    "awsome-ai-agents[core]",
    "langchain",
    "langchain-openai",
    "dspy-ai"
]
advanced = [
    "awsome-ai-agents[intermediate]",
    "pyautogen",
    "crewai",
    "agentops",
    "mcp",
    "chromadb",
    "temporalio",
    "anthropic",
    "matplotlib",
    "numpy",
    "tqdm",
    "umap-learn",
    "semantic-router==0.1.16",
    "opentelemetry-api",
    "opentelemetry-sdk"
]
contributor = [
    "pytest",
    "nbclient",
    "nbformat",
    "nbconvert",
]

[tool.setuptools]
py-modules = []
packages = ["awsome_agents"]
