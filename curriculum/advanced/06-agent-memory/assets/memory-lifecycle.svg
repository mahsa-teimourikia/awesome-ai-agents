<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="t d"><title id="t">Agent memory write manage read lifecycle</title><desc id="d">An observation passes a write policy to typed tenant-scoped memory. Memory is consolidated, contradicted, expired, or retained before ranked retrieval places only selected memories in working context for a decision.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#eef6fa}.h{font-size:27px;font-weight:bold}.x{font-size:17px;font-weight:bold}.s{font-size:13px;fill:#b9cad7}.b{fill:#12354e;stroke:#70b7de;stroke-width:2}.g{fill:#174449;stroke:#7cc8a4;stroke-width:2}.o{fill:#513b1c;stroke:#f3a843;stroke-width:2}.l{stroke:#abc1ce;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#abc1ce"/></marker></defs><rect width="1100" height="440" rx="24" fill="#071826"/><text x="45" y="58" class="h">Agent memory is a governed write → manage → read subsystem</text><rect x="45" y="155" width="150" height="72" rx="12" class="b"/><text x="72" y="190" class="x">Observation</text><text x="64" y="211" class="s">task / tool / user</text><rect x="270" y="155" width="170" height="72" rx="12" class="o"/><text x="303" y="190" class="x">Write policy</text><text x="286" y="211" class="s">scope · source · privacy</text><rect x="515" y="135" width="190" height="110" rx="12" class="g"/><text x="553" y="174" class="x">Typed memory</text><text x="540" y="197" class="s">working · episodic</text><text x="538" y="218" class="s">semantic · procedural</text><rect x="780" y="155" width="150" height="72" rx="12" class="o"/><text x="807" y="190" class="x">Manage</text><text x="793" y="211" class="s">consolidate / forget</text><rect x="950" y="155" width="115" height="72" rx="12" class="b"/><text x="967" y="190" class="x">Rank</text><text x="958" y="211" class="s">read now</text><path d="M195 191H270M440 191H515M705 191H780M930 191H950" class="l"/><rect x="720" y="305" width="210" height="68" rx="12" class="g"/><text x="752" y="337" class="x">Working context</text><text x="759" y="358" class="s">small attributed packet</text><rect x="370" y="305" width="190" height="68" rx="12" class="b"/><text x="412" y="337" class="x">Decision</text><text x="391" y="358" class="s">trace + new evidence</text><path d="M1008 227V270H825V305M720 339H560" class="l"/><path d="M370 339H120V227" class="l"/></svg>
