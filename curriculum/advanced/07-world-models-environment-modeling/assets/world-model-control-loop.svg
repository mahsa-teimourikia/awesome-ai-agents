<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title description">
<title id="title">World-model decision support with independent execution control</title>
<desc id="description">A world-model workflow from observed state through validity, simulation, predicted distributions, constraints, and a planning decision; a separate authority boundary validates approval and fresh state before the external execution control plane; observed outcomes feed calibration and model validation.</desc>
