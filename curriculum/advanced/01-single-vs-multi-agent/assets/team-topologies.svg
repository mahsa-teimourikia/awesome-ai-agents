<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Supervisor team with attributed evidence board</title><desc id="d">A supervisor delegates to observability, deployment, and customer-impact specialists. Their attributed evidence is synthesized by an analyst and challenged by a risk reviewer.</desc><rect width="900" height="300" rx="22" fill="#071827"/><style>.c{fill:#103249;stroke:#87d1e6;stroke-width:2}.g{fill:#16433f;stroke:#79d7bc;stroke-width:2}.t{font:700 17px Arial;fill:#fff}.s{font:14px Arial;fill:#d2e2ee}.l{stroke:#edf7ff;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#edf7ff"/></marker></defs><rect class="c" x="360" y="30" width="170" height="56" rx="12"/><text class="t" x="395" y="64">Supervisor</text><rect class="c" x="80" y="125" width="160" height="55" rx="12"/><text class="t" x="98" y="158">Observability</text><rect class="c" x="370" y="125" width="160" height="55" rx="12"/><text class="t" x="398" y="158">Deployment</text><rect class="c" x="660" y="125" width="160" height="55" rx="12"/><text class="t" x="678" y="158">Customer impact</text><rect class="g" x="330" y="220" width="240" height="50" rx="12"/><text class="t" x="355" y="251">Evidence → analyst → critic</text><path class="l" d="M420 86V105H160V123M445 86V123M475 86V105H740V123M160 180V210H400V218M450 180V218M740 180V210H500V218"/></svg>
