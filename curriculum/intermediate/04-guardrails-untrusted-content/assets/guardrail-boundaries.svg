<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 430" role="img" aria-labelledby="t d"><title id="t">Defense-in-depth guardrail boundaries</title><desc id="d">Untrusted content is classified and quarantined or safely delimited. Structured model actions pass deterministic tenant and policy validation before read-only or approval-gated execution.</desc><rect width="1150" height="430" rx="24" fill="#071827"/><style>.c{fill:#103249;stroke:#87d1e6;stroke-width:2}.w{fill:#4a3019;stroke:#ffb15f;stroke-width:2}.g{fill:#16433f;stroke:#79d7bc;stroke-width:2}.t{font:700 20px Arial;fill:#fff}.s{font:15px Arial;fill:#d2e2ee}.l{stroke:#edf7ff;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#edf7ff"/></marker></defs><text class="t" x="48" y="58" font-size="30">Guardrails constrain impact even when a detector misses an attack</text><rect class="w" x="48" y="160" width="170" height="90" rx="14"/><text class="t" x="72" y="198">Untrusted input</text><text class="s" x="73" y="225">web, RAG, tool output</text><rect class="w" x="294" y="160" width="170" height="90" rx="14"/><text class="t" x="323" y="198">Classify</text><text class="s" x="316" y="225">provenance + markers</text><rect class="c" x="540" y="160" width="180" height="90" rx="14"/><text class="t" x="562" y="198">Context boundary</text><text class="s" x="567" y="225">data, never authority</text><rect class="c" x="796" y="160" width="155" height="90" rx="14"/><text class="t" x="817" y="198">Tool gate</text><text class="s" x="812" y="225">schema + tenant + policy</text><rect class="g" x="1005" y="160" width="110" height="90" rx="14"/><text class="t" x="1019" y="198">Execute</text><text class="s" x="1018" y="225">least power</text><path class="l" d="M218 205H292M464 205H538M720 205H794M951 205H1003"/><path class="l" d="M378 250V330H120V252"/><text class="s" x="135" y="320">quarantine + safe fallback</text><path class="l" d="M870 250V330H1060V252"/><text class="s" x="864" y="320">approval + idempotency for high risk</text></svg>
