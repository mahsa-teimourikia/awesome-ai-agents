<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="t d"><title id="t">Agent evaluation release loop</title><desc id="d">A versioned dataset runs an agent trace through outcome, trajectory, safety, and operations graders before a release gate either ships with monitoring or routes to diagnosis.</desc><rect width="1000" height="330" rx="22" fill="#071827"/><style>.c{fill:#103249;stroke:#87d1e6;stroke-width:2}.g{fill:#16433f;stroke:#79d7bc;stroke-width:2}.w{fill:#4a3019;stroke:#ffb15f;stroke-width:2}.t{font:700 19px Arial;fill:#fff}.s{font:14px Arial;fill:#d2e2ee}.l{stroke:#edf7ff;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#edf7ff"/></marker></defs><rect class="c" x="42" y="120" width="150" height="76" rx="12"/><text class="t" x="62" y="153">Dataset</text><text class="s" x="62" y="178">tasks + policies</text><rect class="c" x="270" y="120" width="150" height="76" rx="12"/><text class="t" x="302" y="153">Trace</text><text class="s" x="291" y="178">answer + tools</text><rect class="c" x="500" y="75" width="175" height="70" rx="12"/><text class="t" x="527" y="108">Outcome</text><text class="s" x="525" y="130">correct/support</text><rect class="c" x="500" y="190" width="175" height="70" rx="12"/><text class="t" x="520" y="222">Trajectory</text><text class="s" x="518" y="245">policy + cost</text><rect class="w" x="755" y="120" width="120" height="76" rx="12"/><text class="t" x="774" y="153">Gate</text><text class="s" x="767" y="178">hard fails first</text><path class="l" d="M192 158H268M420 158H470V110H498M420 158H470V225H498M675 110H715V158H753M675 225H715V158"/><text class="s" x="50" y="300">Measure success, safety, trajectory quality, latency, retries, and cost per successful task—not final prose alone.</text></svg>
