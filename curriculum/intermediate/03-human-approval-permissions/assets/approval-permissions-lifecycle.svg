<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">Human approval and permission lifecycle</title><desc id="desc">A Northstar incident agent gathers evidence, prepares a rollback, validates policy, persists an approval request, then an authorized incident commander approves, modifies, rejects, or escalates it. Only a validated approved action reaches the idempotent execution boundary.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#e4f1f8"/></marker><style>.bg{fill:#071827}.c{fill:#103249;stroke:#87d1e6;stroke-width:2}.r{fill:#482f18;stroke:#ffb15f;stroke-width:2}.g{fill:#16433f;stroke:#79d7bc;stroke-width:2}.t{font:700 20px Arial;fill:#f7fbff}.s{font:16px Arial;fill:#cae0ec}.l{stroke:#e4f1f8;stroke-width:3;marker-end:url(#a)}</style></defs><rect class="bg" width="1200" height="510" rx="24"/><text class="t" x="55" y="62" font-size="31">Human approval is an application control boundary</text><text class="s" x="55" y="94">Northstar’s checkout rollback is prepared by an agent, but only a narrowly authorized reviewer can approve it once.</text><rect class="c" x="54" y="185" width="160" height="90" rx="14"/><text class="t" x="91" y="224">Evidence</text><text class="s" x="76" y="251">read-only tools</text><rect class="c" x="282" y="185" width="170" height="90" rx="14"/><text class="t" x="312" y="224">Proposal</text><text class="s" x="301" y="251">typed action + risk</text><rect class="r" x="521" y="185" width="180" height="90" rx="14"/><text class="t" x="544" y="224">Pause + persist</text><text class="s" x="547" y="251">scope, evidence, expiry</text><rect class="r" x="770" y="185" width="170" height="90" rx="14"/><text class="t" x="807" y="224">Review</text><text class="s" x="789" y="251">authorized identity</text><rect class="g" x="1007" y="185" width="145" height="90" rx="14"/><text class="t" x="1024" y="224">Execute</text><text class="s" x="1024" y="251">idempotent once</text><path class="l" d="M214 230H280M452 230H519M701 230H768M940 230H1005"/><path class="l" d="M855 275V350H585V277"/><text class="s" x="610" y="338">reject / escalate → audit and safe terminal state</text><path class="l" d="M855 275V405H1080V277"/><text class="s" x="888" y="392">modify → revalidate scoped action</text><rect class="c" x="300" y="428" width="600" height="46" rx="12"/><text class="s" x="326" y="458">Audit: actor · tenant · original/final fingerprint · decision · evidence · reason · timestamp</text></svg>
