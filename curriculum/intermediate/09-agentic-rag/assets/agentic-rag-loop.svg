<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="360" viewBox="0 0 1050 360" role="img" aria-labelledby="t d"><title id="t">Agentic RAG evidence loop</title><desc id="d">A question is planned and routed to search, SQL, or graph retrieval. An evidence gate either requests another retrieval or permits cited synthesis and grounded action verification.</desc><rect width="1050" height="360" rx="22" fill="#071826"/><g font-family="Arial" fill="#eef6fa"><text x="42" y="55" font-size="27" font-weight="bold">Agentic RAG: retrieval controlled by evidence gaps</text><g font-size="16" font-weight="bold"><rect x="45" y="135" width="130" height="65" rx="12" fill="#12354e" stroke="#70b7de" stroke-width="2"/><text x="78" y="173">Question</text><rect x="235" y="135" width="160" height="65" rx="12" fill="#12354e" stroke="#70b7de" stroke-width="2"/><text x="272" y="173">Plan / route</text><rect x="455" y="115" width="190" height="105" rx="12" fill="#174449" stroke="#7cc8a4" stroke-width="2"/><text x="495" y="155">Search / SQL / graph</text><text x="501" y="182" font-size="12">typed, tenant-scoped evidence</text><rect x="705" y="135" width="150" height="65" rx="12" fill="#513b1c" stroke="#f3a843" stroke-width="2"/><text x="730" y="173">Evidence gate</text><rect x="885" y="135" width="125" height="65" rx="12" fill="#12354e" stroke="#70b7de" stroke-width="2"/><text x="903" y="166">Cited answer</text><text x="900" y="186" font-size="12">+ grounded proposal</text></g><g stroke="#adc1cc" stroke-width="3" fill="none"><path d="M175 167H235M395 167H455M645 167H705M855 167H885M780 200V280H535V220"/></g><text x="450" y="306" font-size="14" fill="#b9cad7">Gap, conflict, or low support → decompose/rewrite query and retrieve again; bounded by policy and budget.</text></g></svg>
