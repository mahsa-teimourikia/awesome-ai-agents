<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Context routing for a scoped incident agent</title><desc id="desc">System instructions, task identity, environment state, conversation, trusted tools, and scoped memory arrive at a context router. Trust, tenant, freshness, and token checks produce a small context packet. Cross-tenant and poisoned sources are quarantined. The model decision produces a new observation that feeds the router.</desc><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#eff6fa}.h{font-size:28px;font-weight:700}.t{font-size:18px;font-weight:700}.s{font-size:14px;fill:#b9cad7}.box{fill:#12354e;stroke:#6eb7df;stroke-width:2}.safe{fill:#164347;stroke:#7fc8a4;stroke-width:2}.gate{fill:#503b1c;stroke:#f4aa44;stroke-width:2}.risk{fill:#4a2933;stroke:#eb9aa7;stroke-width:2}.line{stroke:#abc1ce;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#abc1ce"/></marker></defs><rect width="1200" height="650" rx="24" fill="#071826"/><text x="55" y="65" class="h">Context engineering: construct the smallest high-signal packet</text><text x="55" y="92" class="s">Context is selected per decision, scoped before assembly, and refreshed after observation.</text><rect x="55" y="155" width="185" height="65" rx="12" class="box"/><text x="86" y="192" class="t">System policy</text><rect x="55" y="255" width="185" height="65" rx="12" class="box"/><text x="76" y="292" class="t">Identity + goal</text><rect x="55" y="355" width="185" height="65" rx="12" class="box"/><text x="79" y="392" class="t">Thread + state</text><rect x="55" y="455" width="185" height="65" rx="12" class="box"/><text x="69" y="492" class="t">Tools + memory</text><rect x="360" y="270" width="255" height="125" rx="16" class="gate"/><text x="417" y="314" class="t">Context router</text><text x="391" y="341" class="s">trust · tenant · freshness</text><text x="405" y="365" class="s">relevance · token budget</text><path d="M240 187H300V310H360M240 287H360M240 387H300V350H360M240 487H300V370H360" class="line"/><rect x="730" y="285" width="220" height="92" rx="14" class="safe"/><text x="766" y="323" class="t">Context packet</text><text x="757" y="349" class="s">policy + selected evidence</text><path d="M615 332H730" class="line"/><rect x="1010" y="285" width="145" height="92" rx="14" class="box"/><text x="1040" y="323" class="t">Model</text><text x="1029" y="349" class="s">decision</text><path d="M950 332H1010" class="line"/><rect x="365" y="475" width="250" height="78" rx="14" class="risk"/><text x="396" y="510" class="t">Quarantine</text><text x="389" y="535" class="s">poisoned / cross-tenant</text><path d="M488 395V475" class="line"/><path d="M1080 377V580H300V520" class="line"/><text x="670" y="605" class="s">New tool result or state transition → re-route just-in-time context for the next decision.</text></svg>
