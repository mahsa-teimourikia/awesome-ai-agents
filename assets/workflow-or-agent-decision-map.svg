<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><title id="title">Architecture ladder from workflow to agent team</title><desc id="desc">Known steps use a deterministic workflow, limited judgment uses a bounded agentic workflow, dynamic evidence paths use a bounded agent, and separable roles may justify a multi-agent team.</desc><defs><style>.b{fill:#f8faf8}.h{font:700 27px Arial;fill:#082b46}.t{font:15px Arial;fill:#24485d}.n{font:700 17px Arial;fill:#082b46}.a{stroke:#1c6e8c;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#1c6e8c"/></marker></defs><rect class="b" width="1200" height="530" rx="24"/><text x="50" y="60" class="h">Choose the least autonomous architecture that works</text><text x="50" y="88" class="t">Autonomy and coordination add cost, latency, evaluation surface, and failure modes.</text><g stroke-width="2"><rect x="60" y="165" width="230" height="100" rx="14" fill="#e4f3f7" stroke="#1c6e8c"/><rect x="340" y="165" width="230" height="100" rx="14" fill="#eef3ff" stroke="#3768a7"/><rect x="620" y="165" width="230" height="100" rx="14" fill="#fff4e7" stroke="#b45a1b"/><rect x="900" y="165" width="230" height="100" rx="14" fill="#f1edff" stroke="#7553a6"/></g><text x="88" y="205" class="n">Deterministic workflow</text><text x="88" y="232" class="t">Known steps: status → report</text><text x="365" y="205" class="n">Bounded workflow</text><text x="365" y="232" class="t">Known branch: unhealthy?</text><text x="650" y="205" class="n">Bounded agent</text><text x="650" y="232" class="t">Dynamic evidence path</text><text x="930" y="205" class="n">Agent team</text><text x="930" y="232" class="t">Separable specialist roles</text><path class="a" d="M290 215H340M570 215H620M850 215H900"/><rect x="250" y="360" width="700" height="82" rx="14" fill="#082b46"/><text x="290" y="395" style="font:700 16px Arial;fill:#fff">Every level still needs: trusted context · narrow tools · budgets · stop conditions · evidence · evaluation</text><text x="290" y="422" style="font:15px Arial;fill:#eaf2f5">Move right only when the added autonomy makes a measurable improvement.</text></svg>
