<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Bounded agent execution patterns</title><desc id="desc">Triage leads to plan, action and observation. Observations can adapt the plan, trigger bounded reflection, complete, or escalate due to policy or budget.</desc><defs><style>.b{fill:#f8faf8}.h{font:700 27px Arial;fill:#082b46}.t{font:15px Arial;fill:#24485d}.n{font:700 17px Arial;fill:#082b46}.a{stroke:#1c6e8c;stroke-width:3;fill:none;marker-end:url(#m)}.o{stroke:#b45a1b;stroke-width:3;fill:none;marker-end:url(#o)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#1c6e8c"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#b45a1b"/></marker></defs><rect class="b" width="1200" height="500" rx="24"/><text x="50" y="60" class="h">Bounded execution patterns</text><text x="50" y="88" class="t">ReAct, plan-and-execute, reflection, and event resumption share explicit budgets and terminal states.</text><g stroke-width="2"><rect x="65" y="180" width="135" height="70" rx="12" fill="#e4f3f7" stroke="#1c6e8c"/><rect x="275" y="180" width="135" height="70" rx="12" fill="#eef3ff" stroke="#3768a7"/><rect x="485" y="180" width="135" height="70" rx="12" fill="#fff4e7" stroke="#b45a1b"/><rect x="695" y="180" width="135" height="70" rx="12" fill="#f4f5f6" stroke="#62727d"/><rect x="930" y="130" width="180" height="70" rx="12" fill="#e9f6ee" stroke="#2b7a53"/><rect x="930" y="290" width="180" height="70" rx="12" fill="#fff0e9" stroke="#b45a1b"/></g><text x="95" y="222" class="n">Triage</text><text x="312" y="222" class="n">Plan</text><text x="525" y="222" class="n">Act</text><text x="720" y="222" class="n">Observe</text><text x="955" y="172" class="n">Complete</text><text x="955" y="332" class="n">Escalate</text><path class="a" d="M200 215H275M410 215H485M620 215H695M830 210C870 190 890 170 930 165M760 250C760 310 680 320 550 290C420 260 370 250 345 250"/><path class="o" d="M760 250C800 330 850 325 930 325"/><text x="360" y="300" class="t">adapt / reflect / replan</text><text x="805" y="290" class="t">budget or policy block</text></svg>
