<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Model Context Protocol architecture</title><desc id="desc">An agent host uses an MCP client and enterprise gateway to connect to scoped MCP servers exposing tools, resources and prompts, while identity, authorization, policy, observability and approval guard the boundaries.</desc><rect width="1200" height="680" rx="28" fill="#f6f8f6"/><style>.h{font:700 30px Arial;fill:#082640}.t{font:700 19px Arial;fill:#082640}.s{font:16px Arial;fill:#33566b}.b{fill:#fff;stroke:#0a637b;stroke-width:3}.o{fill:#fff3e8;stroke:#c3601a;stroke-width:3}.g{fill:#e7f1ed;stroke:#39846c;stroke-width:3}.l{stroke:#0a637b;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L0 8 9 4z" fill="#0a637b"/></marker></defs><text x="60" y="63" class="h">MCP architecture: a capability boundary around tools and context</text><rect x="90" y="115" width="270" height="95" rx="18" class="b"/><text x="140" y="153" class="t">Agent host</text><text x="115" y="183" class="s">model, policy, UI, tracing</text><rect x="465" y="115" width="270" height="95" rx="18" class="o"/><text x="510" y="153" class="t">MCP client + gateway</text><text x="500" y="183" class="s">discovery, routing, policy</text><rect x="840" y="115" width="270" height="95" rx="18" class="b"/><text x="900" y="153" class="t">MCP servers</text><text x="890" y="183" class="s">scoped capabilities</text><path class="l" d="M360 162H463M735 162H838"/><rect x="120" y="295" width="270" height="90" rx="18" class="g"/><text x="190" y="333" class="t">Resources</text><text x="145" y="360" class="s">read-only contextual data</text><rect x="465" y="295" width="270" height="90" rx="18" class="g"/><text x="555" y="333" class="t">Prompts</text><text x="505" y="360" class="s">reusable interaction templates</text><rect x="810" y="295" width="270" height="90" rx="18" class="g"/><text x="900" y="333" class="t">Tools</text><text x="845" y="360" class="s">typed operations / side effects</text><path class="l" d="M975 210V293M600 210V293M230 210V293"/><rect x="90" y="475" width="1020" height="110" rx="20" class="o"/><text x="325" y="518" class="t">Application-owned control plane</text><text x="165" y="552" class="s">identity · OAuth / delegated scopes · tenant policy · tool allowlists · argument/result validation · approvals · budgets · audit · traces · revocation</text><path class="l" d="M600 385V473"/></svg>
