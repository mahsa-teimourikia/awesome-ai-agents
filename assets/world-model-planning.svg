<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="t d"><title id="t">World model planning loop</title><desc id="d">An agent observes an environment, updates an internal world model, simulates candidate actions, compares counterfactual outcomes, chooses a bounded proposal, then validates it in reality.</desc><rect width="1100" height="420" rx="28" fill="#f7f8f5"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="550" y="55" font-size="31" font-weight="700" fill="#09243e">Observe → predict → simulate → choose → verify</text><g fill="#dcecf2" stroke="#2f6f89" stroke-width="2"><rect x="35" y="150" width="160" height="80" rx="16"/><rect x="235" y="150" width="180" height="80" rx="16"/><rect x="455" y="150" width="190" height="80" rx="16"/><rect x="685" y="150" width="160" height="80" rx="16"/><rect x="885" y="150" width="180" height="80" rx="16"/></g><g fill="#09243e"><text x="115" y="191" font-size="18" font-weight="700">Observe</text><text x="325" y="191" font-size="18" font-weight="700">World model</text><text x="550" y="191" font-size="18" font-weight="700">Counterfactuals</text><text x="765" y="191" font-size="18" font-weight="700">Plan</text><text x="975" y="191" font-size="18" font-weight="700">Reality check</text></g><g stroke="#c16422" stroke-width="5"><path d="M195 190h40M415 190h40M645 190h40M845 190h40"/></g><rect x="220" y="300" width="660" height="62" rx="18" fill="#fbede1" stroke="#c16422" stroke-width="2"/><text x="550" y="337" font-size="18" fill="#833707">Use uncertainty, safety constraints, simulator fidelity, and real feedback as decision gates—not imagined success alone.</text></g></svg>
