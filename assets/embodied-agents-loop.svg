<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="t d"><title id="t">Embodied agent safety loop</title><desc id="d">A robot senses the world, plans, checks safety constraints, acts in bounded increments, observes the physical result, and escalates on uncertainty.</desc><rect width="1100" height="430" rx="28" fill="#f7f8f5"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="550" y="55" font-size="31" font-weight="700" fill="#09243e">Embodied agent control loop</text><g fill="#dcecf2" stroke="#2f6f89" stroke-width="2"><rect x="50" y="160" width="150" height="75" rx="16"/><rect x="245" y="160" width="150" height="75" rx="16"/><rect x="440" y="160" width="180" height="75" rx="16"/><rect x="665" y="160" width="150" height="75" rx="16"/><rect x="860" y="160" width="180" height="75" rx="16"/></g><g fill="#09243e"><text x="125" y="198" font-size="18" font-weight="700">Sense</text><text x="320" y="198" font-size="18" font-weight="700">Plan</text><text x="530" y="193" font-size="18" font-weight="700">Safety gate</text><text x="530" y="216" font-size="13">workspace, force, speed</text><text x="740" y="198" font-size="18" font-weight="700">Act</text><text x="950" y="193" font-size="18" font-weight="700">Observe</text><text x="950" y="216" font-size="13">verify physical state</text></g><g stroke="#c16422" stroke-width="5"><path d="M200 197h45M395 197h45M620 197h45M815 197h45"/></g><path d="M950 235c0 100-825 100-825 0" stroke="#2f6f89" stroke-width="4" fill="none"/><text x="550" y="365" font-size="17" fill="#6e3c1d">On uncertainty, constraint violation, or failed verification: stop, hold safe state, and escalate to a human.</text></g></svg>
