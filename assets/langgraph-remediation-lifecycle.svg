<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Durable remediation workflow in LangGraph</title>
  <desc id="desc">A state graph moves from an incident event through evidence collection and assessment to escalation or a human approval boundary before an idempotent action. Persistence, streaming and audit span the lifecycle.</desc>
  <defs><style>.bg{fill:#f8faf8}.title{font:700 27px Arial,sans-serif;fill:#082b46}.sub{font:15px Arial,sans-serif;fill:#355467}.box{stroke-width:2}.h{font:700 17px Arial,sans-serif;fill:#082b46}.t{font:14px Arial,sans-serif;fill:#24485d}.small{font:13px Arial,sans-serif;fill:#24485d}.arrow{stroke:#1c6e8c;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#b45a1b;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#orange)}.pill{font:700 13px Arial,sans-serif;fill:#fff}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1c6e8c"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b45a1b"/></marker></defs>
  <rect class="bg" width="1200" height="610" rx="24"/>
  <text x="54" y="60" class="title">LangGraph remediation control plane</text><text x="54" y="88" class="sub">Use explicit state, deterministic policy, durable checkpoints, and human approval for consequential actions.</text>
  <rect x="55" y="148" width="160" height="92" rx="14" fill="#e4f3f7" stroke="#1c6e8c" class="box"/><text x="78" y="184" class="h">Incident event</text><text x="78" y="210" class="t">Europe checkout drop</text>
  <rect x="270" y="148" width="175" height="92" rx="14" fill="#eef3ff" stroke="#3768a7" class="box"/><text x="297" y="184" class="h">Collect evidence</text><text x="297" y="210" class="t">metrics · logs · deploy</text>
  <rect x="500" y="148" width="165" height="92" rx="14" fill="#f4f5f6" stroke="#62727d" class="box"/><text x="527" y="184" class="h">Assess state</text><text x="527" y="210" class="t">confidence + risk</text>
  <rect x="720" y="148" width="180" height="92" rx="14" fill="#fff4e7" stroke="#b45a1b" class="box"/><text x="745" y="184" class="h">Prepare proposal</text><text x="745" y="210" class="t">rollback; no side effect</text>
  <rect x="955" y="148" width="175" height="92" rx="14" fill="#fff0e9" stroke="#b45a1b" class="box"/><text x="980" y="184" class="h">Approval interrupt</text><text x="980" y="210" class="t">approve · edit · reject</text>
  <path class="arrow" d="M215 194H270M445 194H500M665 194H720M900 194H955"/>
  <rect x="390" y="302" width="210" height="100" rx="14" fill="#fef6f2" stroke="#b45a1b" class="box"/><text x="422" y="340" class="h">Escalate and stop</text><text x="422" y="367" class="t">insufficient evidence or</text><text x="422" y="388" class="t">policy failure</text>
  <path class="dash" d="M582 240V302H500"/><text x="608" y="286" class="small">low confidence</text>
  <rect x="840" y="302" width="245" height="100" rx="14" fill="#e9f6ee" stroke="#2b7a53" class="box"/><text x="868" y="340" class="h">Execute exactly once</text><text x="868" y="367" class="t">idempotency key + audit log</text><text x="868" y="388" class="t">only after verified approval</text>
  <path class="dash" d="M1042 240V302"/><text x="1060" y="281" class="small">approved</text>
  <path class="dash" d="M995 240C920 278 740 280 600 332"/><text x="738" y="278" class="small">rejected / changed</text>
  <rect x="55" y="468" width="1075" height="86" rx="15" fill="#082b46"/><text x="84" y="504" class="pill">DURABLE EXECUTION</text><text x="290" y="504" class="pill">CHECKPOINTER + THREAD ID</text><text x="593" y="504" class="pill">STREAMED STATE EVENTS</text><text x="877" y="504" class="pill">AUDITABLE TRANSITIONS</text><text x="84" y="533" class="small" fill="#eaf2f5">A graph is a control surface: model-driven interpretation can exist inside nodes, while policy, persistence, and side effects remain explicit and inspectable.</text>
</svg>
