<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="t d"><title id="t">Agent security boundaries</title><desc id="d">Untrusted emails, web pages, documents, repositories, memory, tools, MCP servers, identities, and peer agents surround a bounded runtime. Independent context, permission, sandbox, egress, approval, supply-chain, audit, and kill-switch controls contain attacks.</desc><rect width="1200" height="540" rx="24" fill="#f7f8f5"/><style>.h{font:700 28px Arial;fill:#062743}.s{font:700 17px Arial;fill:#fff}.p{fill:#0b3558}.o{fill:#b65a1c}</style><text x="600" y="48" text-anchor="middle" class="h">Agent security: external content is data, never authority</text><rect x="430" y="170" width="340" height="115" rx="18" class="p"/><text x="600" y="215" text-anchor="middle" class="s">Bounded agent runtime</text><text x="600" y="245" text-anchor="middle" class="s">untrusted context + tools</text><g class="o"><rect x="40" y="130" width="245" height="65" rx="12"/><rect x="40" y="250" width="245" height="65" rx="12"/><rect x="915" y="130" width="245" height="65" rx="12"/><rect x="915" y="250" width="245" height="65" rx="12"/></g><g text-anchor="middle" class="s"><text x="162" y="160">Email / web / documents</text><text x="162" y="282">Memory / context / repository</text><text x="1038" y="160">Tools / MCP / supply chain</text><text x="1038" y="282">Identity / peers / external APIs</text></g><rect x="260" y="380" width="680" height="72" rx="16" class="o"/><text x="600" y="410" text-anchor="middle" class="s">Policy, tenant scope, sandbox, egress limits, approval, budget, audit, revoke / kill</text><text x="600" y="437" text-anchor="middle" class="s">Contain even when injection or poisoning detection is imperfect</text></svg>
