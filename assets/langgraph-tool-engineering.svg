<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">LangGraph controlled tool execution</title><desc id="desc">A LangGraph workflow filters a tool catalog, routes to sequential or parallel read tools, validates results, and either proposes an action or escalates. A separate approval and idempotency boundary controls writes.</desc><defs><style>.bg{fill:#f8faf8}.title{font:700 27px Arial,sans-serif;fill:#082b46}.sub{font:15px Arial,sans-serif;fill:#355467}.h{font:700 17px Arial,sans-serif;fill:#082b46}.t{font:14px Arial,sans-serif;fill:#24485d}.a{stroke:#1c6e8c;stroke-width:3;fill:none;marker-end:url(#m)}.o{stroke:#b45a1b;stroke-width:3;fill:none;marker-end:url(#n)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#1c6e8c"/></marker><marker id="n" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#b45a1b"/></marker></defs><rect class="bg" width="1200" height="570" rx="24"/><text x="54" y="60" class="title">LangGraph tool-control workflow</text><text x="54" y="88" class="sub">Model suggestions are routed through deterministic catalog, policy, validation, and execution boundaries.</text><g stroke-width="2"><rect x="55" y="150" width="175" height="85" rx="14" fill="#e4f3f7" stroke="#1c6e8c"/><rect x="290" y="150" width="190" height="85" rx="14" fill="#f4f5f6" stroke="#62727d"/><rect x="540" y="150" width="185" height="85" rx="14" fill="#eef3ff" stroke="#3768a7"/><rect x="790" y="150" width="180" height="85" rx="14" fill="#fff4e7" stroke="#b45a1b"/><rect x="1025" y="150" width="130" height="85" rx="14" fill="#e9f6ee" stroke="#2b7a53"/></g><text x="80" y="184" class="h">Trusted context</text><text x="80" y="210" class="t">actor · tenant · budget</text><text x="316" y="184" class="h">Filter + route</text><text x="316" y="210" class="t">small allowlisted catalog</text><text x="566" y="184" class="h">Read tool graph</text><text x="566" y="210" class="t">sequential / parallel</text><text x="819" y="184" class="h">Validate results</text><text x="819" y="210" class="t">source · freshness · poison</text><text x="1044" y="184" class="h">Propose</text><text x="1044" y="210" class="t">or stop</text><path class="a" d="M230 192H290M480 192H540M725 192H790M970 192H1025"/><rect x="405" y="325" width="185" height="78" rx="13" fill="#f4f5f6" stroke="#62727d" stroke-width="2"/><rect x="640" y="325" width="185" height="78" rx="13" fill="#f4f5f6" stroke="#62727d" stroke-width="2"/><text x="430" y="358" class="h">Sequential reads</text><text x="430" y="382" class="t">status → logs → deploy</text><text x="668" y="358" class="h">Parallel reads</text><text x="668" y="382" class="t">tickets + metrics</text><path class="a" d="M625 235C570 270 515 282 500 325M640 235C670 275 730 280 730 325"/><rect x="795" y="460" width="275" height="58" rx="13" fill="#fff0e9" stroke="#b45a1b" stroke-width="2"/><text x="823" y="495" class="h">Approval + idempotent write</text><path class="o" d="M1090 235V460H935"/></svg>
