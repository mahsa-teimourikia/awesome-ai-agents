<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="t d"><title id="t">Proactive agent lifecycle</title><desc id="d">A persistent agent has an approved goal, receives events or scheduled triggers, deduplicates and validates evidence, decides whether an intervention is useful, then sends a permission-bound notification or escalates.</desc><rect width="1100" height="430" rx="28" fill="#f7f8f5"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="550" y="58" font-size="31" font-weight="700" fill="#09243e">Proactive agent: persistent but bounded</text><g fill="#dcecf2" stroke="#2f6f89" stroke-width="2"><rect x="30" y="155" width="170" height="80" rx="16"/><rect x="235" y="155" width="170" height="80" rx="16"/><rect x="440" y="155" width="190" height="80" rx="16"/><rect x="665" y="155" width="170" height="80" rx="16"/><rect x="870" y="155" width="200" height="80" rx="16"/></g><g fill="#09243e"><text x="115" y="190" font-size="18" font-weight="700">Approved goal</text><text x="320" y="190" font-size="18" font-weight="700">Event / schedule</text><text x="535" y="190" font-size="18" font-weight="700">Validate + dedupe</text><text x="750" y="190" font-size="18" font-weight="700">Assess value</text><text x="970" y="190" font-size="18" font-weight="700">Notify / escalate</text></g><g stroke="#c16422" stroke-width="5"><path d="M200 195h35M405 195h35M630 195h35M835 195h35"/></g><rect x="220" y="305" width="660" height="65" rx="18" fill="#fbede1" stroke="#c16422" stroke-width="2"/><text x="550" y="343" font-size="18" fill="#833707">Controls: user consent · purpose/tenant scope · freshness · quiet hours · rate limits · notification preference · approval for writes · audit + opt-out</text></g></svg>
