<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
 <title id="title">Pydantic AI compliance caseworker</title><desc id="desc">A typed case context flows through a Pydantic AI agent with dependency-injected tools and produces a validated decision that is checked by deterministic policy before routing.</desc>
 <defs><style>.bg{fill:#f8faf8}.title{font:700 27px Arial,sans-serif;fill:#082b46}.sub{font:15px Arial,sans-serif;fill:#355467}.h{font:700 17px Arial,sans-serif;fill:#082b46}.t{font:14px Arial,sans-serif;fill:#24485d}.arr{stroke:#1c6e8c;stroke-width:3;fill:none;marker-end:url(#a)}.warn{stroke:#b45a1b;stroke-width:3;fill:none;marker-end:url(#o)}.light{font:700 13px Arial,sans-serif;fill:#f7fbfc}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#1c6e8c"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#b45a1b"/></marker></defs>
 <rect class="bg" width="1200" height="570" rx="24"/><text x="52" y="59" class="title">Pydantic AI: typed compliance decision workflow</text><text x="52" y="87" class="sub">Schemas make outputs safe to consume; they do not prove facts or authorize actions.</text>
 <rect x="55" y="155" width="195" height="96" rx="14" fill="#e4f3f7" stroke="#1c6e8c" stroke-width="2"/><text x="82" y="191" class="h">Case input</text><text x="82" y="217" class="t">tenant · amount · country</text>
 <rect x="310" y="140" width="275" height="126" rx="16" fill="#eef3ff" stroke="#3768a7" stroke-width="3"/><text x="342" y="180" class="h">Pydantic AI Agent</text><text x="342" y="207" class="t">typed deps + instructions</text><text x="342" y="231" class="t">tools + retryable validation</text>
 <rect x="645" y="155" width="215" height="96" rx="14" fill="#fff4e7" stroke="#b45a1b" stroke-width="2"/><text x="676" y="191" class="h">Typed output</text><text x="676" y="217" class="t">Decision + evidence IDs</text>
 <rect x="920" y="155" width="220" height="96" rx="14" fill="#e9f6ee" stroke="#2b7a53" stroke-width="2"/><text x="947" y="191" class="h">Policy route</text><text x="947" y="217" class="t">approve · escalate · reject</text>
 <path class="arr" d="M250 203H310M585 203H645M860 203H920"/>
 <rect x="266" y="340" width="160" height="78" rx="13" fill="#f4f5f6" stroke="#62727d" stroke-width="2"/><text x="291" y="373" class="h">KYC tool</text><text x="291" y="397" class="t">scoped lookup</text>
 <rect x="470" y="340" width="180" height="78" rx="13" fill="#f4f5f6" stroke="#62727d" stroke-width="2"/><text x="494" y="373" class="h">Screening tool</text><text x="494" y="397" class="t">freshness + source</text>
 <rect x="694" y="340" width="185" height="78" rx="13" fill="#f4f5f6" stroke="#62727d" stroke-width="2"/><text x="720" y="373" class="h">Policy tool</text><text x="720" y="397" class="t">read-only thresholds</text>
 <path class="arr" d="M410 266C380 295 350 306 346 340M460 266V340M515 266C584 294 703 304 787 340"/>
 <rect x="155" y="474" width="880" height="58" rx="14" fill="#082b46"/><text x="188" y="510" class="light">VALIDATE: input → tool arguments → output schema → evidence → authorization → audit/evaluation</text>
</svg>
