<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Layered guardrails and policy enforcement</title><desc id="d">A request crosses deterministic guardrails for input, trusted context, tool selection, arguments, action authorization, output, and audit. A policy engine can allow, deny, require approval, rate limit, budget, sandbox, or kill the run at each boundary.</desc><rect width="1200" height="650" rx="24" fill="#f7f8f5"/><style>.h{font:700 28px Arial;fill:#062743}.s{font:700 17px Arial;fill:#fff}.p{fill:#0b3558}.o{fill:#b65a1c}</style><text x="600" y="48" text-anchor="middle" class="h">Guardrails are layered policy enforcement, not a single classifier</text><g class="p"><rect x="460" y="85" width="280" height="52" rx="12"/><rect x="460" y="160" width="280" height="52" rx="12"/><rect x="460" y="235" width="280" height="52" rx="12"/><rect x="460" y="310" width="280" height="52" rx="12"/><rect x="460" y="385" width="280" height="52" rx="12"/><rect x="460" y="460" width="280" height="52" rx="12"/></g><g text-anchor="middle" class="s"><text x="600" y="118">Input validation</text><text x="600" y="193">Reasoning / trusted context</text><text x="600" y="268">Tool selection + permissions</text><text x="600" y="343">Tool arguments + sandbox</text><text x="600" y="418">Action authorization</text><text x="600" y="493">Output validation + audit</text></g><rect x="80" y="210" width="260" height="190" rx="18" class="o"/><text x="210" y="250" text-anchor="middle" class="s">Policy engine</text><text x="210" y="285" text-anchor="middle" class="s">allow / deny / approve</text><text x="210" y="315" text-anchor="middle" class="s">rate / budget / kill</text><text x="210" y="345" text-anchor="middle" class="s">identity / tenant / risk</text><rect x="860" y="210" width="260" height="190" rx="18" class="o"/><text x="990" y="250" text-anchor="middle" class="s">Evidence</text><text x="990" y="285" text-anchor="middle" class="s">decision + reason</text><text x="990" y="315" text-anchor="middle" class="s">trace + version</text><text x="990" y="345" text-anchor="middle" class="s">incident + revoke</text><text x="600" y="590" text-anchor="middle" class="h" font-size="18">A deny or kill switch stops the run; a model cannot override server-side authorization, budgets, or sandboxes.</text></svg>
