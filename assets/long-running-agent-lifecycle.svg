<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 650" role="img" aria-labelledby="title desc"><title id="title">Durable lifecycle for a long-running agent</title><desc id="desc">A durable agent job validates a request, checkpoints state, dispatches bounded work, waits for a timer, external event, or human approval, resumes from state, then completes, escalates, or cancels. Every transition is audited and subject to time, cost, and action budgets.</desc><rect width="1240" height="650" rx="28" fill="#f7f8f5"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#356b83"/></marker></defs><style>.h{font:700 30px Arial,sans-serif;fill:#062743}.s{font:500 18px Arial,sans-serif;fill:#18384c}.w{font:700 18px Arial,sans-serif;fill:#fff}.b{fill:#0b3558}.o{fill:#b65a1c}.p{fill:#e8f0ee;stroke:#356b83;stroke-width:2}.l{stroke:#356b83;stroke-width:3;fill:none;marker-end:url(#a)}</style><text x="620" y="57" text-anchor="middle" class="h">Long-running agent: durable state, bounded waits, safe resume</text><rect x="55" y="125" width="190" height="70" rx="14" class="b"/><text x="150" y="168" text-anchor="middle" class="w">Job contract</text><path d="M245 160H325" class="l"/><rect x="325" y="105" width="235" height="110" rx="16" class="p"/><text x="442" y="145" text-anchor="middle" class="h" font-size="23">Persist checkpoint</text><text x="350" y="180" class="s">state · owner · deadline</text><path d="M560 160H640" class="l"/><rect x="640" y="125" width="210" height="70" rx="14" class="b"/><text x="745" y="168" text-anchor="middle" class="w">Bounded work step</text><path d="M745 195V280" class="l"/><rect x="475" y="300" width="540" height="130" rx="18" fill="#dbeef2" stroke="#0b6b83" stroke-width="2"/><text x="745" y="342" text-anchor="middle" class="h" font-size="24">Wait state: no polling loop</text><text x="505" y="382" class="s">timer / scheduler</text><text x="685" y="382" class="s">external event</text><text x="855" y="382" class="s">human approval</text><path d="M745 430V505H640" class="l"/><rect x="380" y="505" width="260" height="70" rx="14" class="b"/><text x="510" y="548" text-anchor="middle" class="w">Resume from checkpoint</text><path d="M640 540H760" class="l"/><rect x="760" y="505" width="210" height="70" rx="14" class="o"/><text x="865" y="548" text-anchor="middle" class="w">Complete / escalate / cancel</text><text x="620" y="620" text-anchor="middle" class="s">Audit each transition; enforce tenant scope, idempotency, deadlines, action/spend budgets, cancellation, and retention policy.</text></svg>
