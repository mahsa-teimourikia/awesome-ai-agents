<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="t d"><title id="t">Agent orchestration graph</title><desc id="d">An orchestrator routes a request through deterministic workflow nodes, bounded agent nodes, parallel evidence collection, a checkpoint and human approval node, then recovery or completion. Queues and schedules support event-driven and long-running execution.</desc><rect width="1100" height="440" rx="24" fill="#f7f8f5"/><style>.h{font:700 26px Arial;fill:#062743}.s{font:700 16px Arial;fill:#fff}.b{fill:#0b3558}.o{fill:#b65a1c}</style><text x="550" y="45" text-anchor="middle" class="h">Orchestration controls work; agents contribute bounded intelligence</text><g class="b"><rect x="45" y="140" width="160" height="60" rx="12"/><rect x="270" y="140" width="160" height="60" rx="12"/><rect x="495" y="140" width="160" height="60" rx="12"/><rect x="720" y="140" width="160" height="60" rx="12"/><rect x="945" y="140" width="120" height="60" rx="12"/></g><g class="s" text-anchor="middle"><text x="125" y="177">Route / event</text><text x="350" y="177">Graph / DAG</text><text x="575" y="177">Parallel evidence</text><text x="800" y="177">Checkpoint / approval</text><text x="1005" y="177">Complete</text></g><path d="M205 170h65m-10-10 10 10-10 10M430 170h65m-10-10 10 10-10 10M655 170h65m-10-10 10 10-10 10M880 170h65m-10-10 10 10-10 10" stroke="#356b83" stroke-width="4" fill="none"/><rect x="260" y="290" width="590" height="65" rx="14" class="o"/><text x="555" y="328" text-anchor="middle" class="s">Queue + schedule + durable state + retries + recovery + budgets + audit</text></svg>
