<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Policy-bound model routing lifecycle</title>
  <desc id="desc">A task is classified for modality, capability, risk, latency, and budget. A router selects a fast, reasoning, multimodal, or coding model, evaluates the output, then accepts, escalates through a cascade, invokes a bounded ensemble, or sends the task for human review.</desc>
  <rect width="1280" height="700" rx="28" fill="#f7f8f5"/>
  <style>.h{font:700 31px Arial,sans-serif;fill:#062743}.s{font:500 18px Arial,sans-serif;fill:#18384c}.k{font:700 17px Arial,sans-serif;fill:#fff}.b{fill:#0b3558;stroke:#0b3558}.o{fill:#bb5b1c;stroke:#bb5b1c}.p{fill:#e8f0ee;stroke:#376b83;stroke-width:2}.line{stroke:#376b83;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#376b83"/></marker></defs>
  <text x="640" y="60" text-anchor="middle" class="h">Model routing is a policy decision, not a prompt trick</text>
  <rect x="55" y="130" width="225" height="155" rx="18" class="p"/><text x="168" y="165" text-anchor="middle" class="h" font-size="23">Task contract</text><text x="75" y="205" class="s">• modality / task type</text><text x="75" y="235" class="s">• quality &amp; risk floor</text><text x="75" y="265" class="s">• latency &amp; cost budget</text>
  <rect x="365" y="108" width="265" height="200" rx="18" fill="#dbeef2" stroke="#0b6b83" stroke-width="2"/><text x="498" y="148" text-anchor="middle" class="h" font-size="25">Route policy</text><text x="390" y="190" class="s">Hard capability filters</text><text x="390" y="222" class="s">SLO, availability, tenancy</text><text x="390" y="254" class="s">Expected value / confidence</text><text x="390" y="286" class="s">Audit decision + reason</text>
  <path d="M280 208 H365" class="line"/>
  <rect x="740" y="105" width="200" height="70" rx="14" class="b"/><text x="840" y="148" text-anchor="middle" class="k">Fast text model</text><text x="960" y="148" class="s">simple, known path</text>
  <rect x="740" y="205" width="200" height="70" rx="14" class="b"/><text x="840" y="248" text-anchor="middle" class="k">Reasoning model</text><text x="960" y="248" class="s">ambiguous / multi-step</text>
  <rect x="740" y="305" width="200" height="70" rx="14" class="b"/><text x="840" y="348" text-anchor="middle" class="k">Multimodal model</text><text x="960" y="348" class="s">screen, image, document</text>
  <rect x="740" y="405" width="200" height="70" rx="14" class="b"/><text x="840" y="448" text-anchor="middle" class="k">Coding model</text><text x="960" y="448" class="s">repo, test, patch task</text>
  <path d="M630 208 H705 V140 H740 M705 208 V240 H740 M705 208 V340 H740 M705 208 V440 H740" class="line"/>
  <rect x="400" y="500" width="480" height="115" rx="18" fill="#fff4e9" stroke="#bb5b1c" stroke-width="2"/><text x="640" y="542" text-anchor="middle" class="h" font-size="24">Evaluate output and route evidence</text><text x="640" y="578" text-anchor="middle" class="s">quality floor · support · schema · safety · latency · cost</text>
  <path d="M840 475 V500" class="line"/>
  <rect x="945" y="520" width="270" height="72" rx="14" class="o"/><text x="1080" y="550" text-anchor="middle" class="k">Escalate / ensemble / review</text><text x="1080" y="577" text-anchor="middle" class="k">only when policy permits</text><path d="M880 557 H945" class="line"/>
  <text x="640" y="660" text-anchor="middle" class="s">A routing policy never grants tool permissions or substitutes for authorization, approvals, or release gates.</text>
</svg>
