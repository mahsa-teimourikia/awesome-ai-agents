<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Agentic enterprise architecture control plane</title><desc id="desc">An agent catalog, tool and MCP registry, identity and policy gateway, knowledge plane, orchestration, observability, evaluation and FinOps form a control plane around enterprise agents.</desc><rect width="1200" height="700" rx="30" fill="#f7f8f5"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="65" font-size="34" font-weight="700" fill="#09243e">Agentic enterprise architecture</text><text x="600" y="100" font-size="18" fill="#465b66">Operate a governed ecosystem—not a collection of autonomous demos.</text><rect x="410" y="135" width="380" height="88" rx="20" fill="#09243e"/><text x="600" y="172" font-size="23" font-weight="700" fill="white">Enterprise orchestration</text><text x="600" y="199" font-size="16" fill="#dcebed">routes work · applies budgets · joins outcomes</text><rect x="70" y="285" width="230" height="115" rx="18" fill="#dcecf2" stroke="#2f6f89" stroke-width="2"/><text x="185" y="325" font-size="20" font-weight="700" fill="#09243e">Agent catalog</text><text x="185" y="351" font-size="15" fill="#173b50">owner · capability · risk</text><text x="185" y="374" font-size="15" fill="#173b50">version · eval status</text><rect x="330" y="285" width="230" height="115" rx="18" fill="#dcecf2" stroke="#2f6f89" stroke-width="2"/><text x="445" y="325" font-size="20" font-weight="700" fill="#09243e">Tool + MCP registry</text><text x="445" y="351" font-size="15" fill="#173b50">schema · provenance</text><text x="445" y="374" font-size="15" fill="#173b50">trust · lifecycle</text><rect x="640" y="285" width="230" height="115" rx="18" fill="#fbede1" stroke="#c16422" stroke-width="2"/><text x="755" y="325" font-size="20" font-weight="700" fill="#833707">Identity + policy</text><text x="755" y="351" font-size="15" fill="#6e3c1d">SSO · scopes · delegation</text><text x="755" y="374" font-size="15" fill="#6e3c1d">approval · audit</text><rect x="900" y="285" width="230" height="115" rx="18" fill="#dcecf2" stroke="#2f6f89" stroke-width="2"/><text x="1015" y="325" font-size="20" font-weight="700" fill="#09243e">Knowledge plane</text><text x="1015" y="351" font-size="15" fill="#173b50">tenant scope · provenance</text><text x="1015" y="374" font-size="15" fill="#173b50">retention · freshness</text><g stroke="#2f6f89" stroke-width="5"><path d="M185 285V245h415v-22M445 285v-62M755 285V245H600v-22M1015 285V245H600v-22"/></g><rect x="220" y="490" width="760" height="110" rx="22" fill="#fff" stroke="#2f6f89" stroke-width="2"/><text x="600" y="531" font-size="22" font-weight="700" fill="#09243e">Operations and governance plane</text><text x="600" y="562" font-size="17" fill="#173b50">trace + audit · evaluation and release gates · incident response · FinOps attribution, budgets, and cost-per-accepted-outcome</text></g><path d="M600 400v90" stroke="#c16422" stroke-width="6"/><path d="M600 490l-14-16m14 16l14-16" stroke="#c16422" stroke-width="6" fill="none"/></svg>
