<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Agent governance lifecycle</title><desc id="d">A lifecycle shows register and assign owner, classify risk and autonomy, approve data and access, evaluate and release, monitor and oversee, respond to incidents, then change, retire, and retain audit evidence.</desc><rect width="1200" height="500" rx="24" fill="#f7f8f5"/><style>.h{font:700 28px Arial;fill:#062743}.s{font:600 17px Arial;fill:#fff}.p{fill:#0b3558}.o{fill:#b65a1c}</style><text x="600" y="55" text-anchor="middle" class="h">Agent governance is an operational lifecycle</text><g class="p"><rect x="50" y="150" width="190" height="70" rx="14"/><rect x="280" y="150" width="190" height="70" rx="14"/><rect x="510" y="150" width="190" height="70" rx="14"/><rect x="740" y="150" width="190" height="70" rx="14"/><rect x="970" y="150" width="190" height="70" rx="14"/></g><g text-anchor="middle" class="s"><text x="145" y="180">Inventory + owner</text><text x="145" y="205">purpose + lifecycle</text><text x="375" y="180">Risk + autonomy</text><text x="375" y="205">classification</text><text x="605" y="180">Data + tools</text><text x="605" y="205">policy + access</text><text x="835" y="180">Evaluate + approve</text><text x="835" y="205">change + release</text><text x="1065" y="180">Monitor + oversight</text><text x="1065" y="205">audit + accountability</text></g><path d="M240 185h40m-10-10 10 10-10 10M470 185h40m-10-10 10 10-10 10M700 185h40m-10-10 10 10-10 10M930 185h40m-10-10 10 10-10 10" stroke="#356b83" stroke-width="4" fill="none"/><rect x="360" y="310" width="480" height="82" rx="16" class="o"/><text x="600" y="345" text-anchor="middle" class="s">Incident response, remediation, revoke, retire</text><text x="600" y="372" text-anchor="middle" class="s">then update inventory, controls, evaluations, and evidence</text><path d="M1065 220v55H840m-10-10 10 10-10 10" stroke="#356b83" stroke-width="4" fill="none"/><text x="600" y="455" text-anchor="middle" class="h" font-size="18">Human accountability, evidence, and revocable authority remain outside the agent runtime.</text></svg>
