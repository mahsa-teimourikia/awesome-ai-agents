<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 670" role="img" aria-labelledby="title desc">
 <title id="title">Agent economics budget and decision lifecycle</title><desc id="desc">A user request enters a budget controller that assigns token, action, latency, and spend budgets. A planner chooses cached, parallel, or sequential tool and model work. Each stage records cost and elapsed time, and either returns an evaluated result, routes to a cheaper or stronger model, or stops safely when a budget is exhausted.</desc>
 <rect width="1280" height="670" rx="28" fill="#f7f8f5"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#356b83"/></marker></defs><style>.h{font:700 31px Arial,sans-serif;fill:#062743}.s{font:500 18px Arial,sans-serif;fill:#18384c}.w{font:700 18px Arial,sans-serif;fill:#fff}.b{fill:#0b3558}.o{fill:#b65a1c}.p{fill:#e8f0ee;stroke:#356b83;stroke-width:2}.l{stroke:#356b83;stroke-width:3;fill:none;marker-end:url(#a)}</style>
 <text x="640" y="58" text-anchor="middle" class="h">Agent economics: govern the whole trajectory</text>
 <rect x="55" y="128" width="205" height="98" rx="16" class="b"/><text x="158" y="168" text-anchor="middle" class="w">User request</text><text x="158" y="198" text-anchor="middle" class="w">quality + deadline</text>
 <rect x="355" y="102" width="295" height="150" rx="18" class="p"/><text x="502" y="140" text-anchor="middle" class="h" font-size="24">Budget controller</text><text x="383" y="178" class="s">token / reasoning budget</text><text x="383" y="208" class="s">tool / action budget</text><text x="383" y="238" class="s">spend / latency budget</text><path d="M260 177H355" class="l"/>
 <rect x="750" y="95" width="190" height="60" rx="12" class="b"/><text x="845" y="132" text-anchor="middle" class="w">Cache hit</text><rect x="750" y="180" width="190" height="60" rx="12" class="b"/><text x="845" y="217" text-anchor="middle" class="w">Fast route</text><rect x="750" y="265" width="190" height="60" rx="12" class="b"/><text x="845" y="302" text-anchor="middle" class="w">Reasoning route</text><rect x="750" y="350" width="190" height="60" rx="12" class="b"/><text x="845" y="387" text-anchor="middle" class="w">Parallel tools</text><path d="M650 177H705V125H750M705 177V210H750M705 177V295H750M705 177V380H750" class="l"/>
 <rect x="350" y="430" width="580" height="108" rx="18" fill="#dbeef2" stroke="#0b6b83" stroke-width="2"/><text x="640" y="469" text-anchor="middle" class="h" font-size="24">Account and evaluate after every stage</text><text x="640" y="507" text-anchor="middle" class="s">actual tokens · tool calls · retries · queue time · p95 latency · spend · evidence quality</text><path d="M845 410V430" class="l"/>
 <rect x="990" y="435" width="220" height="66" rx="14" class="o"/><text x="1100" y="464" text-anchor="middle" class="w">Accept, promote, or stop</text><text x="1100" y="489" text-anchor="middle" class="w">with an honest limitation</text><path d="M930 484H990" class="l"/>
 <text x="640" y="615" text-anchor="middle" class="s">Do not spend an unlimited budget to rescue a weak plan. Route, cache, parallelize, or stop only when the measured value justifies it.</text>
</svg>
