<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="t d"><title id="t">Multimodal agent loop</title><desc id="d">An agent sees images, documents and screens, hears audio, reads sensors, reasons over attributed evidence, plans, then uses bounded tools or escalates.</desc><rect width="1100" height="450" rx="28" fill="#f7f8f5"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="550" y="60" font-size="32" font-weight="700" fill="#09243e">See → Hear → Reason → Plan → Act</text><g fill="#dcecf2" stroke="#2f6f89" stroke-width="2"><rect x="35" y="155" width="160" height="80" rx="16"/><rect x="235" y="155" width="160" height="80" rx="16"/><rect x="435" y="155" width="190" height="80" rx="16"/><rect x="665" y="155" width="160" height="80" rx="16"/><rect x="865" y="155" width="190" height="80" rx="16"/></g><g fill="#09243e"><text x="115" y="190" font-size="18" font-weight="700">See</text><text x="115" y="214" font-size="14">image · doc · UI · video</text><text x="315" y="190" font-size="18" font-weight="700">Hear</text><text x="315" y="214" font-size="14">speech · alarm</text><text x="530" y="190" font-size="18" font-weight="700">Reason</text><text x="530" y="214" font-size="14">provenance + time</text><text x="745" y="190" font-size="18" font-weight="700">Plan</text><text x="745" y="214" font-size="14">evidence gap + policy</text><text x="960" y="190" font-size="18" font-weight="700">Act</text><text x="960" y="214" font-size="14">bounded tool / escalate</text></g><g stroke="#c16422" stroke-width="5"><path d="M195 195h40M395 195h40M625 195h40M825 195h40"/></g><rect x="220" y="315" width="660" height="72" rx="18" fill="#fbede1" stroke="#c16422" stroke-width="2"/><text x="550" y="347" font-size="19" font-weight="700" fill="#833707">Guardrails: tenant scope · provenance · consent · redaction · freshness · tool permissions · trace/audit</text><text x="550" y="371" font-size="14" fill="#6e3c1d">Store compact, attributed cross-modal memories—not raw recordings by default.</text></g></svg>
