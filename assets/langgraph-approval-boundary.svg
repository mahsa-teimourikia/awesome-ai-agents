<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
 <title id="title">LangGraph human approval boundary</title><desc id="desc">A remediation proposal passes a deterministic policy gate then pauses durably for an authenticated human response before an idempotent action or rejection.</desc>
 <defs><style>.bg{fill:#f8faf8}.title{font:700 27px Arial,sans-serif;fill:#082b46}.sub{font:15px Arial,sans-serif;fill:#355467}.h{font:700 18px Arial,sans-serif;fill:#082b46}.t{font:14px Arial,sans-serif;fill:#24485d}.arr{stroke:#1c6e8c;stroke-width:3;fill:none;marker-end:url(#a)}.rarr{stroke:#b45a1b;stroke-width:3;fill:none;marker-end:url(#o)}.tag{font:700 13px Arial,sans-serif;fill:#fff}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#1c6e8c"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#b45a1b"/></marker></defs>
 <rect class="bg" width="1200" height="470" rx="24"/><text x="55" y="58" class="title">Approval is a durable security boundary, not a sentence in a prompt</text><text x="55" y="86" class="sub">Bind approval to the exact action, arguments, incident, approver, and expiry; resume the same thread only after verification.</text>
 <rect x="55" y="150" width="190" height="110" rx="15" fill="#eef3ff" stroke="#3768a7" stroke-width="2"/><text x="84" y="190" class="h">Graph proposal</text><text x="84" y="216" class="t">restart_checkout</text><text x="84" y="238" class="t">incident + evidence</text>
 <rect x="320" y="150" width="220" height="110" rx="15" fill="#f4f5f6" stroke="#62727d" stroke-width="2"/><text x="351" y="190" class="h">Deterministic policy</text><text x="351" y="216" class="t">tenant · role · risk · args</text><text x="351" y="238" class="t">approval required?</text>
 <rect x="615" y="150" width="220" height="110" rx="15" fill="#fff4e7" stroke="#b45a1b" stroke-width="2"/><text x="646" y="190" class="h">Durable interrupt</text><text x="646" y="216" class="t">checkpoint + thread ID</text><text x="646" y="238" class="t">JSON approval payload</text>
 <rect x="910" y="150" width="235" height="110" rx="15" fill="#fff0e9" stroke="#b45a1b" stroke-width="2"/><text x="942" y="190" class="h">Authenticated operator</text><text x="942" y="216" class="t">approve · modify · reject</text><text x="942" y="238" class="t">reason + identity + time</text>
 <path class="arr" d="M245 205H320M540 205H615M835 205H910"/>
 <rect x="783" y="330" width="265" height="80" rx="15" fill="#e9f6ee" stroke="#2b7a53" stroke-width="2"/><text x="816" y="365" class="h">Idempotent execution</text><text x="816" y="390" class="t">execute once · record receipt</text>
 <rect x="305" y="330" width="265" height="80" rx="15" fill="#fef6f2" stroke="#b45a1b" stroke-width="2"/><text x="341" y="365" class="h">Cancel / re-plan</text><text x="341" y="390" class="t">no side effect; record reason</text>
 <path class="rarr" d="M1028 260V330H916"/><path class="rarr" d="M970 260C900 316 700 325 570 365"/><text x="1042" y="305" class="tag" fill="#b45a1b">APPROVE</text><text x="682" y="310" class="t">REJECT OR EDIT</text>
</svg>
