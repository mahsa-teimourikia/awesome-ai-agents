<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Reliable agentic systems trade-off map</title>
  <desc id="desc">A production controller balances autonomy, context, capability, and coordination against controls for reliability, privacy, security, quality, and determinism.</desc>
  <rect width="1200" height="650" rx="28" fill="#f7f8f5"/>
  <text x="70" y="85" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#09243e">Designing reliable agentic systems</text>
  <text x="70" y="122" font-family="Arial, sans-serif" font-size="19" fill="#465b66">Move right only when measured benefit pays for the added control surface.</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="175" width="330" height="360" rx="22" fill="#e7f0f4" stroke="#2f6f89" stroke-width="2"/>
    <text x="100" y="220" font-size="22" font-weight="700" fill="#09243e">Capability you add</text>
    <text x="100" y="270" font-size="19" fill="#173b50">Autonomy</text><text x="100" y="312" font-size="19" fill="#173b50">More context &amp; memory</text><text x="100" y="354" font-size="19" fill="#173b50">More tools</text><text x="100" y="396" font-size="19" fill="#173b50">More reasoning time</text><text x="100" y="438" font-size="19" fill="#173b50">More agents</text><text x="100" y="480" font-size="19" fill="#173b50">Flexible routing</text>
    <rect x="800" y="175" width="330" height="360" rx="22" fill="#fbede1" stroke="#c16422" stroke-width="2"/>
    <text x="830" y="220" font-size="22" font-weight="700" fill="#833707">Controls you must add</text>
    <text x="830" y="270" font-size="19" fill="#6e3c1d">Budgets &amp; stop conditions</text><text x="830" y="312" font-size="19" fill="#6e3c1d">Scope, retention &amp; redaction</text><text x="830" y="354" font-size="19" fill="#6e3c1d">Authorization &amp; approvals</text><text x="830" y="396" font-size="19" fill="#6e3c1d">Latency/cost SLOs &amp; evals</text><text x="830" y="438" font-size="19" fill="#6e3c1d">Ownership &amp; termination</text><text x="830" y="480" font-size="19" fill="#6e3c1d">Policy gates &amp; audit trail</text>
    <path d="M430 355H750" stroke="#c16422" stroke-width="7" stroke-linecap="round"/><path d="M750 355l-25-18m25 18l-25 18" stroke="#c16422" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="460" y="275" width="260" height="160" rx="80" fill="#09243e"/>
    <text x="510" y="337" font-size="23" font-weight="700" fill="#fffaf2">Evidence-led</text><text x="514" y="370" font-size="23" font-weight="700" fill="#fffaf2">architecture</text>
    <text x="490" y="405" font-size="15" fill="#dbe9e8">least autonomy that works</text>
  </g>
  <text x="70" y="598" font-family="Arial, sans-serif" font-size="18" fill="#465b66">Baseline → deterministic workflow → bounded agent → stateful graph → specialist team. Validate each promotion with outcome, trajectory, cost, latency, and safety evidence.</text>
</svg>
