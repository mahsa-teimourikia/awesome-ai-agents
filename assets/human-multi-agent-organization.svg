<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
 <title id="title">Human plus multi-agent organization</title><desc id="desc">A human sponsor delegates a bounded EU checkout incident investigation to a manager agent that coordinates specialist research, data, coding, analysis, and review agents. The manager returns an evidence-backed proposal to a human approver.</desc>
 <rect width="1200" height="720" rx="30" fill="#f7f8f5"/>
 <g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="65" font-size="34" font-weight="700" fill="#09243e">Human + multi-agent organization</text><text x="600" y="100" font-size="18" fill="#465b66">Humans own objectives and authority; agents own bounded, attributable work products.</text></g>
 <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="450" y="135" width="300" height="78" rx="18" fill="#09243e"/><text x="600" y="167" font-size="21" font-weight="700" fill="white">Human sponsor</text><text x="600" y="193" font-size="16" fill="#dcebed">goal · constraints · authority</text>
 <path d="M600 213v45" stroke="#c16422" stroke-width="6"/><path d="M600 258l-14-16m14 16l14-16" stroke="#c16422" stroke-width="6" fill="none"/>
 <rect x="425" y="265" width="350" height="90" rx="20" fill="#dcecf2" stroke="#2f6f89" stroke-width="2"/><text x="600" y="302" font-size="22" font-weight="700" fill="#09243e">Manager agent</text><text x="600" y="329" font-size="16" fill="#173b50">decompose · delegate · monitor · escalate</text>
 <path d="M600 355v38M170 393h860" stroke="#2f6f89" stroke-width="5"/>
 <g fill="#fff" stroke="#2f6f89" stroke-width="2"><rect x="80" y="415" width="190" height="100" rx="18"/><rect x="290" y="415" width="190" height="100" rx="18"/><rect x="500" y="415" width="190" height="100" rx="18"/><rect x="710" y="415" width="190" height="100" rx="18"/><rect x="920" y="415" width="190" height="100" rx="18"/></g>
 <g font-family="Arial,sans-serif" text-anchor="middle" fill="#09243e"><text x="175" y="454" font-size="19" font-weight="700">Research</text><text x="175" y="480" font-size="15">sources &amp; claims</text><text x="385" y="454" font-size="19" font-weight="700">Data</text><text x="385" y="480" font-size="15">metrics &amp; segments</text><text x="595" y="454" font-size="19" font-weight="700">Coding</text><text x="595" y="480" font-size="15">safe diagnostic patch</text><text x="805" y="454" font-size="19" font-weight="700">Analysis</text><text x="805" y="480" font-size="15">hypothesis &amp; impact</text><text x="1015" y="454" font-size="19" font-weight="700">Review</text><text x="1015" y="480" font-size="15">risk &amp; evidence gaps</text></g>
 <g stroke="#2f6f89" stroke-width="4"><path d="M175 393v22M385 393v22M595 393v22M805 393v22M1015 393v22"/><path d="M600 515v60"/></g>
 <rect x="385" y="580" width="430" height="82" rx="19" fill="#fbede1" stroke="#c16422" stroke-width="2"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="614" font-size="21" font-weight="700" fill="#833707">Human approver</text><text x="600" y="642" font-size="16" fill="#6e3c1d">reviews evidence, risk, exact action, and audit record</text></g>
</svg>
