<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Production agent architecture</title><desc id="desc">A user request passes through an agent gateway and orchestrator to an agent runtime. The runtime accesses scoped memory, tools through MCP, and knowledge through RAG. Policy and identity guard every operation, while observability and evaluation monitor the system. Queues, checkpoints, and durable workflow state support asynchronous recovery.</desc><rect width="1280" height="720" rx="28" fill="#f7f8f5"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#356b83"/></marker></defs><style>.h{font:700 29px Arial,sans-serif;fill:#062743}.s{font:500 17px Arial,sans-serif;fill:#18384c}.w{font:700 18px Arial,sans-serif;fill:#fff}.b{fill:#0b3558}.p{fill:#e8f0ee;stroke:#356b83;stroke-width:2}.o{fill:#b65a1c}.l{stroke:#356b83;stroke-width:3;fill:none;marker-end:url(#a)}</style><text x="640" y="50" text-anchor="middle" class="h">Production agent architecture: runtime inside a durable control plane</text><rect x="515" y="80" width="250" height="52" rx="12" class="b"/><text x="640" y="113" text-anchor="middle" class="w">User / application</text><path d="M640 132V165" class="l"/><rect x="500" y="165" width="280" height="58" rx="12" class="b"/><text x="640" y="201" text-anchor="middle" class="w">Agent gateway: auth, rate, routing</text><path d="M640 223V255" class="l"/><rect x="500" y="255" width="280" height="58" rx="12" class="b"/><text x="640" y="291" text-anchor="middle" class="w">Orchestrator / session router</text><path d="M640 313V345" class="l"/><rect x="500" y="345" width="280" height="60" rx="12" class="b"/><text x="640" y="382" text-anchor="middle" class="w">Agent runtime: bounded steps</text><rect x="85" y="355" width="220" height="125" rx="16" class="p"/><text x="195" y="392" text-anchor="middle" class="h" font-size="22">Memory / state</text><text x="110" y="425" class="s">session, checkpoint</text><text x="110" y="452" class="s">durable store</text><path d="M305 415H500" class="l"/><rect x="975" y="340" width="210" height="140" rx="16" class="p"/><text x="1080" y="377" text-anchor="middle" class="h" font-size="22">Tools / knowledge</text><text x="1000" y="410" class="s">MCP gateway</text><text x="1000" y="437" class="s">RAG / external systems</text><path d="M780 415H975" class="l"/><rect x="135" y="535" width="270" height="72" rx="14" class="o"/><text x="270" y="565" text-anchor="middle" class="w">Queues / scheduler / workers</text><text x="270" y="590" text-anchor="middle" class="w">async + retries + autoscaling</text><path d="M500 405V570H405" class="l"/><rect x="500" y="535" width="280" height="72" rx="14" class="o"/><text x="640" y="565" text-anchor="middle" class="w">Policy / identity / approvals</text><text x="640" y="590" text-anchor="middle" class="w">server-side enforcement</text><path d="M640 405V535" class="l"/><rect x="875" y="535" width="290" height="72" rx="14" class="o"/><text x="1020" y="565" text-anchor="middle" class="w">Observability / evaluation</text><text x="1020" y="590" text-anchor="middle" class="w">traces, SLOs, release gates</text><path d="M780 405V570H875" class="l"/><text x="640" y="670" text-anchor="middle" class="s">Stateless gateways/workers scale horizontally; durable stores, queues, checkpoints, and recovery plans preserve correctness across failure and disaster.</text></svg>
