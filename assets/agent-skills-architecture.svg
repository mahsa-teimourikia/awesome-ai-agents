<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Agent skills architecture</title><desc id="desc">A task router selects a skill description from a governed library. The selected skill progressively loads instructions, references, scripts and assets, then may call scoped MCP tools or subagents under application policy.</desc><rect width="1200" height="650" rx="28" fill="#f6f8f6"/><style>.h{font:700 30px Arial;fill:#082640}.t{font:700 19px Arial;fill:#082640}.s{font:16px Arial;fill:#33566b}.b{fill:#fff;stroke:#0a637b;stroke-width:3}.o{fill:#fff3e8;stroke:#c3601a;stroke-width:3}.g{fill:#e7f1ed;stroke:#39846c;stroke-width:3}.l{stroke:#0a637b;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L0 8 9 4z" fill="#0a637b"/></marker></defs><text x="60" y="62" class="h">Agent Skills: reusable procedural capability with progressive disclosure</text><rect x="70" y="115" width="250" height="75" rx="18" class="b"/><text x="125" y="158" class="t">Task + policy context</text><rect x="430" y="115" width="340" height="75" rx="18" class="o"/><text x="480" y="158" class="t">Skill router / discovery index</text><rect x="880" y="115" width="250" height="75" rx="18" class="b"/><text x="930" y="158" class="t">Selected skill</text><path class="l" d="M320 152H428M770 152H878"/><rect x="120" y="285" width="210" height="85" rx="16" class="g"/><text x="180" y="323" class="t">SKILL.md</text><text x="145" y="350" class="s">metadata + workflow</text><rect x="370" y="285" width="210" height="85" rx="16" class="g"/><text x="425" y="323" class="t">References</text><text x="400" y="350" class="s">on-demand context</text><rect x="620" y="285" width="210" height="85" rx="16" class="g"/><text x="685" y="323" class="t">Scripts</text><text x="655" y="350" class="s">deterministic helpers</text><rect x="870" y="285" width="210" height="85" rx="16" class="g"/><text x="930" y="323" class="t">Assets</text><text x="910" y="350" class="s">templates/resources</text><path class="l" d="M1005 190V245H225V283M1005 190V245H475V283M1005 190V245H725V283M1005 190V245H975V283"/><rect x="205" y="470" width="340" height="75" rx="18" class="b"/><text x="275" y="513" class="t">Scoped MCP tools</text><rect x="655" y="470" width="340" height="75" rx="18" class="b"/><text x="730" y="513" class="t">Bounded subagents</text><path class="l" d="M725 370V430H375V468M725 370V430H825V468"/><text x="158" y="610" class="s">Govern throughout: provenance · version · review · permissions · budgets · validation · evaluation · audit · revocation</text></svg>
