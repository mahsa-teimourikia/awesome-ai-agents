<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Agentic software engineering lifecycle</title><desc id="desc">A coding agent runs within a sandboxed repository lifecycle: understand, plan, edit, test, review, prepare a pull request, CI gate, and human merge.</desc><rect width="1200" height="560" rx="28" fill="#f7f8f5"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="600" y="65" font-size="34" font-weight="700" fill="#09243e">Agentic software engineering</text><text x="600" y="100" font-size="18" fill="#465b66">Long-horizon coding behavior is bounded by repository, sandbox, tests, review, CI, and human merge controls.</text><g fill="#dcecf2" stroke="#2f6f89" stroke-width="2"><rect x="50" y="185" width="150" height="80" rx="16"/><rect x="225" y="185" width="150" height="80" rx="16"/><rect x="400" y="185" width="150" height="80" rx="16"/><rect x="575" y="185" width="150" height="80" rx="16"/><rect x="750" y="185" width="150" height="80" rx="16"/><rect x="925" y="185" width="150" height="80" rx="16"/></g><g fill="#09243e"><text x="125" y="219" font-size="17" font-weight="700">Understand</text><text x="125" y="242" font-size="14">search + context</text><text x="300" y="219" font-size="17" font-weight="700">Plan</text><text x="300" y="242" font-size="14">files + risks</text><text x="475" y="219" font-size="17" font-weight="700">Edit</text><text x="475" y="242" font-size="14">minimal patch</text><text x="650" y="219" font-size="17" font-weight="700">Test</text><text x="650" y="242" font-size="14">sandboxed run</text><text x="825" y="219" font-size="17" font-weight="700">Review</text><text x="825" y="242" font-size="14">diff + threat scan</text><text x="1000" y="219" font-size="17" font-weight="700">PR + CI</text><text x="1000" y="242" font-size="14">evidence gate</text></g><g stroke="#c16422" stroke-width="5"><path d="M200 225h25M375 225h25M550 225h25M725 225h25M900 225h25"/></g><rect x="245" y="350" width="710" height="110" rx="20" fill="#fbede1" stroke="#c16422" stroke-width="2"/><text x="600" y="392" font-family="Arial,sans-serif" text-anchor="middle" font-size="22" font-weight="700" fill="#833707">Application-owned controls</text><text x="600" y="424" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" fill="#6e3c1d">least-privilege sandbox · secret isolation · allow-listed commands · test/coverage gates · branch protection · human reviewer/merger · traces and cost budgets</text></g></svg>
