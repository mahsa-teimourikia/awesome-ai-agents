<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="t d"><title id="t">Agent judge evaluation loop</title><desc id="d">An agent produces a trajectory and answer. A rubric-based evaluator judges outcome, evidence, tools, policy, and operations, returns a score and failure class, then compares calibration with human labels and routes failures into improvements.</desc><rect width="1100" height="420" rx="24" fill="#f7f8f5"/><style>.h{font:700 26px Arial;fill:#062743}.s{font:700 17px Arial;fill:#fff}.p{fill:#0b3558}.o{fill:#b65a1c}</style><text x="550" y="48" text-anchor="middle" class="h">Judge the trajectory and outcome—not polished prose alone</text><g class="p"><rect x="45" y="150" width="180" height="66" rx="12"/><rect x="300" y="150" width="210" height="66" rx="12"/><rect x="585" y="150" width="210" height="66" rx="12"/><rect x="870" y="150" width="185" height="66" rx="12"/></g><g text-anchor="middle" class="s"><text x="135" y="190">Agent</text><text x="405" y="190">Trajectory + answer</text><text x="690" y="190">Rubric / judge</text><text x="962" y="190">Score + failure</text></g><path d="M225 183h75m-10-10 10 10-10 10M510 183h75m-10-10 10 10-10 10M795 183h75m-10-10 10 10-10 10" stroke="#356b83" stroke-width="4" fill="none"/><rect x="330" y="295" width="440" height="60" rx="14" class="o"/><text x="550" y="331" text-anchor="middle" class="s">Human agreement, calibration, bias checks, ensemble / release gate</text></svg>
